plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.orcaocr'
version = '0.1.0'

android {
  namespace 'expo.modules.orcaocr'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Bundled Latin model: available offline, without waiting for Play Services downloads.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
